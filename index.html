              <label for="scheduleCategory">分类</label>
              <select id="scheduleCategory" name="category">
                ${["study", "work", "health", "rest", "life", "other"].map((value) => `<option value="${value}" ${item.category === value ? "selected" : ""}>${categoryLabel(value)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="scheduleStart">开始时间</label>
              <input id="scheduleStart" name="startTime" type="time" value="${escapeHtml(item.startTime || draftScheduleTime || "09:00")}">
            </div>
            <div class="field">
              <label for="scheduleEnd">结束时间</label>
              <input id="scheduleEnd" name="endTime" type="time" value="${escapeHtml(item.endTime || "10:00")}">
            </div>
          </div>
          <div class="field">
            <label for="scheduleNote">备注</label>
            <textarea id="scheduleNote" name="note" placeholder="写地点、准备事项或希望达成的结果。">${escapeHtml(item.note || "")}</textarea>
          </div>
          <div class="field">
            <label for="schedulePlan">关联计划</label>
            <select id="schedulePlan" name="planId">${planOptions}</select>
          </div>
          <div class="dialog-actions">
            <button type="button" class="ghost-btn" data-close>取消</button>
            <button type="submit" class="primary-btn">保存日程</button>
          </div>
        `;
      }

      if (type === "checklist") {
        return `
          <div class="field">
            <label for="checklistTitle">事项名称</label>
            <input id="checklistTitle" name="title" required maxlength="80" value="${escapeHtml(item.title || "")}" placeholder="例如：带学生证">
          </div>
          <div class="field">
            <label for="checklistNote">备注</label>
            <textarea id="checklistNote" name="note" placeholder="补充说明">${escapeHtml(item.note || "")}</textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="checklistDate">日期</label>
              <input id="checklistDate" name="date" type="date" value="${escapeHtml(item.date || "")}">
            </div>
            <div class="field">
              <label for="checklistPriority">优先级</label>
              <select id="checklistPriority" name="priority">
                <option value="normal" ${item.priority === "normal" ? "selected" : ""}>普通</option>
                <option value="high" ${item.priority === "high" ? "selected" : ""}>高</option>
                <option value="mid" ${item.priority === "mid" ? "selected" : ""}>中</option>
                <option value="low" ${item.priority === "low" ? "selected" : ""}>低</option>
              </select>
            </div>
          </div>
          <label class="field" style="display:flex;align-items:center;gap:8px;flex-direction:row;">
            <input type="checkbox" name="parentVisible" ${item.parentVisible ? "checked" : ""}>
            <span>家长可见</span>
          </label>
          <div class="dialog-actions">
            <button type="button" class="ghost-btn" data-close>取消</button>
            <button type="submit" class="primary-btn">保存事项</button>
          </div>
        `;
      }

      if (type === "link") {
        return `
          <div class="field">
            <label for="linkTitle">标题</label>
            <input id="linkTitle" name="title" required maxlength="80" value="${escapeHtml(item.title || "")}" placeholder="例如：学校教务系统">
          </div>
          <div class="field">
            <label for="linkUrl">网址</label>
            <input id="linkUrl" name="url" type="url" required value="${escapeHtml(item.url || "")}" placeholder="https://example.com">
          </div>
          <div class="field">
            <label for="linkCategory">分类</label>
            <input id="linkCategory" name="category" value="${escapeHtml(item.category || "")}" placeholder="例如：学习、工具">
          </div>
          <label class="field" style="display:flex;align-items:center;gap:8px;flex-direction:row;">
            <input type="checkbox" name="parentVisible" ${item.parentVisible ? "checked" : ""}>
            <span>家长可见</span>
          </label>
          <div class="dialog-actions">
            <button type="button" class="ghost-btn" data-close>取消</button>
            <button type="submit" class="primary-btn">保存链接</button>
          </div>
        `;
      }

      if (type === "log") {
        return `
          <div class="field">
            <label for="logTitle">标题</label>
            <input id="logTitle" name="title" required maxlength="80" value="${escapeHtml(item.title || "")}" placeholder="给今天一页取个标题">
          </div>
          <div class="form-row">
            <div class="field">
              <label for="logDate">日期</label>
              <input id="logDate" name="date" type="date" value="${escapeHtml(item.date || todayKey)}">
            </div>
            <div class="field">
              <label for="logMood">状态</label>
              <select id="logMood" name="mood">
                ${["great", "good", "calm", "low", "tired"].map((mood) => `<option value="${mood}" ${item.mood === mood ? "selected" : ""}>${moodLabel(mood)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="field">
            <label for="logBody">今天发生了什么</label>
            <textarea id="logBody" name="body" placeholder="记录事实、感受、进展，或任何你不想忘记的片段。">${escapeHtml(item.body || "")}</textarea>
          </div>
          <div class="field">
            <label for="logTags">标签</label>
            <input id="logTags" name="tags" value="${escapeHtml((item.tags || []).join("，"))}" placeholder="用逗号分隔，例如：运动，阅读">
          </div>
          <div class="field">
            <label>照片</label>
            <div class="log-image-picker">
              <div class="log-image-picker-row">
                <button type="button" class="ghost-btn" id="logImagePickBtn">＋ 从相册选择</button>
                <span class="log-image-picker-hint" id="logImagePickerHint">最多 9 张</span>
              </div>
              <input type="file" id="logImageInput" accept="image/*" multiple class="hidden">
              <div class="log-image-picker-grid" id="logImagePickerGrid"></div>
            </div>
          </div>
          <div class="dialog-actions">
            <button type="button" class="ghost-btn" data-close>取消</button>
            <button type="submit" class="primary-btn">保存日志</button>
          </div>
        `;
      }
    }

    dialogForm.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target : event.target.parentElement;
      if (target?.matches?.("[data-close]")) closeDialog();
      const openPlanButton = target?.closest?.('[data-open="plan"]');
      if (openPlanButton) {
        draftPlanGoalId = openPlanButton.dataset.goalId || null;
        pushDialogState();
        openDialog("plan", null, true);
      }
    });

    dialogForm.addEventListener("input", (event) => {
      if (event.target.id === "goalProgress") {
        const value = document.getElementById("progressValue");
        if (value) value.textContent = `${event.target.value}%`;
      }
    });

    function handleSubmit(event) {
      event.preventDefault();
      const data = new FormData(dialogForm);
      const type = dialogType;
      const now = new Date().toISOString();

      if (type === "goal") {
        const item = {
          id: editing?.id || uid("goal"),
          title: data.get("title").trim(),
          note: data.get("note").trim(),
          targetDate: data.get("targetDate"),
          createdAt: editing?.createdAt || now,
          updatedAt: now
        };
        if (!item.title) return;
        if (editing) {
          state.goals = state.goals.map((goal) => (goal.id === item.id ? item : goal));
        } else {
          state.goals.push(item);
        }
        draftNewGoalPlans.forEach((plan) => {
          state.plans.push({
            ...plan,
            goalId: item.id,
            focusDate: null,
            createdAt: now,
            updatedAt: now
          });
        });
        const selectedPlanIds = new Set(draftGoalPlanSelections);
        state.plans = state.plans.map((plan) => {
          if (plan.goalId === item.id && !selectedPlanIds.has(plan.id)) {
            return { ...plan, goalId: null };
          }
          if (selectedPlanIds.has(plan.id) && (!plan.goalId || plan.goalId === item.id)) {
            return { ...plan, goalId: item.id };
          }
          return plan;
        });
      }

      if (type === "plan") {
        const steps = draftSteps
          .map((step, index) => ({ id: step.id || uid("step"), title: step.title.trim(), done: Boolean(step.done) }))
          .filter((step) => step.title);
        const item = {
          id: editing?.id || uid("plan"),
          title: data.get("title").trim(),
          note: data.get("note").trim(),
          date: data.get("date"),
          dueDate: data.get("dueDate") || data.get("date") || todayKey,
          priority: data.get("priority") || "normal",
          goalId: data.get("goalId") || null,
          focusDate: editing?.focusDate || null,
          steps,
          completed: editing?.completed || false,
          completedAt: editing?.completedAt || null,
          createdAt: editing?.createdAt || now,
          updatedAt: now
        };
        if (!item.title) return;
        if (editing) {
          state.plans = state.plans.map((plan) => (plan.id === item.id ? item : plan));
        } else {
          state.plans.push(item);
        }
      }

      if (type === "schedule") {
        const item = {
          id: editing?.id || uid("schedule"),
          title: data.get("title").trim(),
          date: data.get("date") || todayKey,
          startTime: data.get("startTime"),
          endTime: data.get("endTime"),
          note: data.get("note").trim(),
          category: data.get("category") || "life",
          planId: data.get("planId") || null,
          createdAt: editing?.createdAt || now,
          updatedAt: now
        };
        if (!item.title) return;
        if (item.startTime && item.endTime && item.endTime <= item.startTime) {
          showToast("结束时间需要晚于开始时间");
          return;
        }
        if (editing) {
          state.schedules = state.schedules.map((schedule) => (schedule.id === item.id ? item : schedule));
        } else {
          state.schedules.push(item);
        }
      }

      if (type === "checklist") {
        const item = {
          id: editing?.id || uid("checklist"),
          title: data.get("title").trim(),
          note: data.get("note").trim(),
          date: data.get("date") || null,
          priority: data.get("priority") || "normal",
          parentVisible: data.get("parentVisible") === "on",
          done: editing?.done || false,
          createdAt: editing?.createdAt || now,
          updatedAt: now
        };
        if (!item.title) return;
        if (editing) {
          state.checklists = state.checklists.map((entry) => entry.id === item.id ? item : entry);
        } else {
          state.checklists.push(item);
        }
      }

      if (type === "link") {
        const item = {
          id: editing?.id || uid("link"),
          title: data.get("title").trim(),
          url: data.get("url").trim(),
          category: data.get("category").trim(),
          parentVisible: data.get("parentVisible") === "on",
          createdAt: editing?.createdAt || now,
          updatedAt: now
        };
        if (!item.title || !item.url) return;
        if (editing) {
          state.links = state.links.map((entry) => entry.id === item.id ? item : entry);
        } else {
          state.links.push(item);
        }
      }

      if (type === "log") {
        const tags = data.get("tags").split(/[,，]/).map((tag) => tag.trim()).filter(Boolean);
        const images = draftLogImages.slice(0, 9);
        const item = {
          id: editing?.id || uid("log"),
          title: data.get("title").trim(),
          date: data.get("date") || todayKey,
          body: data.get("body").trim(),
          mood: data.get("mood"),
          tags,
          images,
          imageUrl: images[0] || "",
          createdAt: editing?.createdAt || now,
          updatedAt: now
        };
        if (!item.title) return;
        if (editing) {
          state.logs = state.logs.map((log) => (log.id === item.id ? item : log));
        } else {
          state.logs.push(item);
        }
      }

      closeDialog();
      saveState();
      showToast(type === "goal" ? "目标已保存" : type === "plan" ? "计划已保存" : type === "schedule" ? "日程已保存" : type === "checklist" ? "事项已保存" : type === "link" ? "链接已保存" : "日志已保存");
    }

    function togglePlanStep(planId, stepId) {
      const plan = state.plans.find((item) => item.id === planId);
      const step = plan?.steps?.find((item) => item.id === stepId);
      if (!plan || !step) return;
      step.done = !step.done;
      plan.updatedAt = new Date().toISOString();
      saveState();
    }

    function togglePlanFocus(id) {
      const plan = state.plans.find((item) => item.id === id);
      if (!plan) return;
      const wasFocused = plan.focusDate === todayKey;
      plan.focusDate = wasFocused ? null : todayKey;
      plan.updatedAt = new Date().toISOString();
      saveState();
      showToast(wasFocused ? "已取消今日重点" : "已设为今日重点");
    }

    function togglePlan(id) {
      const plan = state.plans.find((item) => item.id === id);
      if (!plan) return;
      plan.completed = !plan.completed;
      plan.completedAt = plan.completed ? todayKey : null;
      plan.updatedAt = new Date().toISOString();
      saveState();
      showToast(plan.completed ? "已完成，做得好" : "已重新打开");
    }

    function toggleChecklist(id) {
      const item = state.checklists.find((entry) => entry.id === id);
      if (!item) return;
      item.done = !item.done;
      item.updatedAt = new Date().toISOString();
      saveState();
    }

    function deleteItem(type, id) {
      const label = { goal: "目标", plan: "计划", schedule: "日程", checklist: "事项", link: "链接", log: "日志" }[type];
      if (!confirm(`确定删除这条${label}吗？此操作无法撤销。`)) return;
      if (type === "goal") {
        state.goals = state.goals.filter((item) => item.id !== id);
        state.plans = state.plans.map((plan) => plan.goalId === id ? { ...plan, goalId: null } : plan);
      }
      if (type === "plan") state.plans = state.plans.filter((item) => item.id !== id);
      if (type === "schedule") state.schedules = state.schedules.filter((item) => item.id !== id);
      if (type === "checklist") state.checklists = state.checklists.filter((item) => item.id !== id);
      if (type === "link") state.links = state.links.filter((item) => item.id !== id);
      if (type === "log") state.logs = state.logs.filter((item) => item.id !== id);
      saveState();
      showToast(`${label}已删除`);
    }

    function downloadTextFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function dateKeyWithOffset(offsetDays) {
      const date = new Date(`${todayKey}T00:00:00`);
      date.setDate(date.getDate() + offsetDays);
      return localDateKey(date);
    }

    function archiveLogsBefore(cutoff) {
      return [...state.logs]
        .filter((log) => (log.date || "") < cutoff)
        .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || "").localeCompare(b.createdAt || ""));
    }

    function openArchiveDialog() {
      if (!archiveCutoff.value) archiveCutoff.value = dateKeyWithOffset(-90);
      updateArchiveCount();
      archiveBackdrop.classList.remove("hidden");
      archiveBackdrop.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeArchiveDialog() {
      archiveBackdrop.classList.add("hidden");
      archiveBackdrop.setAttribute("aria-hidden", "true");
      syncBodyOverflow();
    }

    function updateArchiveCount() {
      if (!archiveCutoff.value) return;
      const logs = archiveLogsBefore(archiveCutoff.value);
      if (!logs.length) {
        archiveCount.textContent = "这个日期之前没有可导出的日志。";
        return;
      }
      const first = formatDate(logs[0].date);
      const last = formatDate(logs[logs.length - 1].date);
      archiveCount.textContent = `将导出 ${logs.length} 条日志，时间范围：${first} 到 ${last}。`;
    }

    function buildArchiveHtml(archive) {
      const cards = archive.logs.map((log) => {
        const images = getLogImages(log).map((src) => `
          <img src="${escapeHtml(src)}" alt="">
        `).join("");
        return `
          <article class="entry">
            <div class="entry-date">${escapeHtml(formatDate(log.date))}</div>
            <h2>${escapeHtml(log.title || "无标题")}</h2>
            ${log.body ? `<p>${escapeHtml(log.body)}</p>` : ""}
            ${images ? `<div class="images">${images}</div>` : ""}
            <div class="meta">${escapeHtml(moodLabel(log.mood))}${(log.tags || []).length ? " · " + log.tags.map(escapeHtml).join(" · ") : ""}</div>
          </article>
        `;
      }).join("");

      const recoveryJson = JSON.stringify(archive).replaceAll("<", "\\u003c");
      return `<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日行一页 · 本地日记簿</title>
  <style>
    :root { color-scheme: light; --paper:#f7f4ed; --surface:#fffdf8; --ink:#18231e; --muted:#66736c; --line:#e3ddd0; --green:#4a7c59; }
    * { box-sizing: border-box; }
    body { margin:0; padding:32px 18px 60px; background:linear-gradient(180deg,#eef3ec,var(--paper)); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .wrap { width:min(880px,100%); margin:0 auto; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 24px; }
    input,button { font:inherit; }
    input { flex:1; min-width:220px; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
    button { padding:11px 14px; border:0; border-radius:12px; background:var(--green); color:#fff; cursor:pointer; }
    .entry { margin:0 0 16px; padding:20px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 10px 30px rgba(24,35,30,.05); }
    .entry-date,.meta { color:var(--muted); font-size:13px; }
    .entry h2 { margin:7px 0 10px; font-size:21px; }
    .entry p { margin:0; white-space:pre-wrap; line-height:1.75; }
    .images { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:14px; }
    .images img { width:100%; border-radius:12px; object-fit:cover; }
    .meta { margin-top:14px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>日行一页 · 本地日记簿</h1>
    <p class="entry-date">导出时间：${escapeHtml(new Date().toLocaleString("zh-CN"))}</p>
    <div class="toolbar">
      <input id="search" placeholder="搜索标题或正文...">
      <button id="downloadRecovery" type="button">下载恢复文件</button>
    </div>
    <div id="entries">${cards || "<p>没有日志。</p>"}</div>
  </main>
  \x3Cscript type="application/json" id="archiveRecoveryData">${recoveryJson}\x3C/script>
  \x3Cscript>
    const search = document.getElementById("search");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll(".entry").forEach((entry) => {
        entry.classList.toggle("hidden", q && !entry.textContent.toLowerCase().includes(q));
      });
    });
    document.getElementById("downloadRecovery").addEventListener("click", () => {
      const data = document.getElementById("archiveRecoveryData").textContent;
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "日行一页-恢复文件-${escapeHtml(archive.cutoff)}.json";
      link.click();
      URL.revokeObjectURL(url);
    });
  \x3C/script>
</body>
</html>`;
    }

    function exportLogArchive(format) {
      const cutoff = archiveCutoff.value;
      if (!cutoff) {
        showToast("请先选择导出日期");
        return;
      }
      const logs = archiveLogsBefore(cutoff);
      if (!logs.length) {
        showToast("没有符合条件的旧日志");

      const weeks = [];
      for (let week = start; week <= end; week += 1) {
        if (week % 2 === 0) weeks.push(week);
      }

    }

    function rangeWeeks(start, end) {
      const weeks = [];
      for (let week = start; week <= end; week += 1) weeks.push(week);

    }

    let lightboxScale = 1;
    let lightboxTranslateX = 0;
    let lightboxTranslateY = 0;
    let lightboxImages = [];
    let lightboxIndex = 0;
    let lightboxPointers = [];
    let lightboxDragStart = null;
    let lightboxPinchStart = null;
    let lightboxSwipeStart = null;

    function setLightboxTransform(scale, x, y, immediate = false) {
      lightboxScale = Math.min(5, Math.max(1, scale));
      lightboxTranslateX = x;
      lightboxTranslateY = y;
      lightboxImage.classList.toggle("is-zooming", immediate);
      lightboxImage.style.transform = `translate(${lightboxTranslateX}px, ${lightboxTranslateY}px) scale(${lightboxScale})`;
      lightboxImage.style.cursor = lightboxScale > 1.01 ? "grab" : "default";
    }

    function zoomLightboxBy(factor) {
      const nextScale = Math.min(5, Math.max(1, lightboxScale * factor));
      if (Math.abs(nextScale - lightboxScale) < 0.001) return;
      setLightboxTransform(nextScale, lightboxTranslateX, lightboxTranslateY, true);
    }

    function openLightbox(input, index = 0) {
      const images = Array.isArray(input) ? input.filter(Boolean) : input ? [input] : [];
      if (!images.length) return;
      lightboxImages = images;
      lightboxIndex = Math.min(Math.max(0, Number(index) || 0), images.length - 1);
      lightboxImage.src = lightboxImages[lightboxIndex];
      updateLightboxControls();
      setLightboxTransform(1, 0, 0, true);
      lightboxBackdrop.classList.remove("hidden");
      lightboxBackdrop.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function updateLightboxControls() {
      const multiple = lightboxImages.length > 1;
      lightboxPrev.classList.toggle("hidden", !multiple);
      lightboxNext.classList.toggle("hidden", !multiple);
      lightboxCounter.classList.toggle("hidden", !multiple);
      lightboxCounter.textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
    }

    function showAdjacentLightboxImage(delta) {
      if (lightboxImages.length < 2) return;
      lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
      lightboxImage.src = lightboxImages[lightboxIndex];
      updateLightboxControls();
      setLightboxTransform(1, 0, 0, true);
    }

    function closeLightbox() {
      lightboxBackdrop.classList.add("hidden");
      lightboxBackdrop.setAttribute("aria-hidden", "true");

      lightboxImage.style.transform = "";
      lightboxImages = [];

      lightboxPointers = [];
      lightboxDragStart = null;
      lightboxPinchStart = null;
      lightboxSwipeStart = null;
      syncBodyOverflow();
    }

    function syncBodyOverflow() {
      const modalOpen = !lightboxBackdrop.classList.contains("hidden")
        || !logDetailBackdrop.classList.contains("hidden")
        || !archiveBackdrop.classList.contains("hidden")
        || !dialogBackdrop.classList.contains("hidden");
      document.body.style.overflow = modalOpen ? "hidden" : "";
    }

    function handleLightboxPointerDown(event) {
      if (lightboxBackdrop.classList.contains("hidden")) return;
      lightboxPointers.push({ id: event.pointerId, x: event.clientX, y: event.clientY });
      if (lightboxPointers.length === 1) {
        lightboxSwipeStart = {
          x: event.clientX,
          y: event.clientY,
        };
        lightboxDragStart = {
          x: event.clientX,
          y: event.clientY,
          translateX: lightboxTranslateX,
          translateY: lightboxTranslateY,
        };
        lightboxImage.setPointerCapture?.(event.pointerId);
      } else if (lightboxPointers.length === 2) {
        lightboxSwipeStart = null;
        lightboxDragStart = null;
        const [first, second] = lightboxPointers;
        lightboxPinchStart = {
          distance: Math.hypot(second.x - first.x, second.y - first.y),
          scale: lightboxScale,
          center: {
            x: (first.x + second.x) / 2,
            y: (first.y + second.y) / 2,
          },
          translateX: lightboxTranslateX,
          translateY: lightboxTranslateY,
        };
      }
      lightboxImage.classList.add("is-zooming");
    }

    function handleLightboxPointerMove(event) {
      if (lightboxBackdrop.classList.contains("hidden")) return;
      const pointerIndex = lightboxPointers.findIndex((pointer) => pointer.id === event.pointerId);
      if (pointerIndex === -1) return;
      lightboxPointers[pointerIndex] = { id: event.pointerId, x: event.clientX, y: event.clientY };

      if (lightboxPointers.length === 1 && lightboxDragStart && lightboxScale > 1.01) {
        const dx = event.clientX - lightboxDragStart.x;
        const dy = event.clientY - lightboxDragStart.y;
        setLightboxTransform(lightboxScale, lightboxDragStart.translateX + dx, lightboxDragStart.translateY + dy, true);
      } else if (lightboxPointers.length === 2 && lightboxPinchStart) {
        const [first, second] = lightboxPointers;
        const distance = Math.hypot(second.x - first.x, second.y - first.y);
        const scale = Math.min(5, Math.max(1, lightboxPinchStart.scale * (distance / lightboxPinchStart.distance)));
        const center = {
          x: (first.x + second.x) / 2,
          y: (first.y + second.y) / 2,
        };
        const centerDeltaX = center.x - lightboxPinchStart.center.x;
        const centerDeltaY = center.y - lightboxPinchStart.center.y;
        setLightboxTransform(
          scale,
          lightboxPinchStart.translateX + centerDeltaX,
          lightboxPinchStart.translateY + centerDeltaY,
          true,
        );
      }
    }

    function handleLightboxPointerUp(event) {
      lightboxPointers = lightboxPointers.filter((pointer) => pointer.id !== event.pointerId);
      if (lightboxPointers.length === 0 && lightboxSwipeStart && lightboxScale <= 1.01 && lightboxImages.length > 1) {
        const dx = event.clientX - lightboxSwipeStart.x;
        const dy = event.clientY - lightboxSwipeStart.y;
        if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          showAdjacentLightboxImage(dx < 0 ? 1 : -1);
        }
      }
      if (lightboxPointers.length === 0) {
        lightboxDragStart = null;
        lightboxPinchStart = null;
        lightboxSwipeStart = null;
      } else if (lightboxPointers.length === 1 && lightboxScale > 1.01) {
        const [pointer] = lightboxPointers;
        lightboxDragStart = {
          x: pointer.x,
          y: pointer.y,
          translateX: lightboxTranslateX,
          translateY: lightboxTranslateY,
        };
      }
      lightboxImage.classList.remove("is-zooming");
      if (lightboxImage.hasPointerCapture?.(event.pointerId)) {
        lightboxImage.releasePointerCapture?.(event.pointerId);
      }
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }
  </script>
</body>
</html>
