<!doctype html>
<html lang="zh-CN" style="background:#f7f8f3;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f3">
  <title>日行一页 · 个人计划与日志</title>
  <style>
    :root {
      --paper: #f7f8f3;
      --paper-deep: #eef1e9;
      --surface: #fdfdf9;
      --ink: #17211c;
      --muted: #667169;
      --line: #dde2d9;
      --accent: #c95233;
      --accent-soft: #f8e4dc;
      --amber: #e5ac3c;
      --green: #3f7a5b;
      --shadow: 0 14px 36px rgba(24, 35, 30, 0.07);
      --shadow-soft: 0 8px 20px rgba(24, 35, 30, 0.05);
      --radius: 22px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% -12%, rgba(229, 172, 60, 0.13), transparent 30rem),
        linear-gradient(180deg, var(--paper), var(--paper-deep));
      background-color: var(--paper);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 30px 22px 24px;
      border-right: 1px solid rgba(24, 35, 30, 0.08);
      background: rgba(251, 252, 248, 0.97);
      backdrop-filter: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
    }

    .brand-mark {
      position: relative;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 10px;
      background: var(--ink);
      box-shadow: 4px 4px 0 var(--amber);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      border-radius: 999px;
      background: var(--surface);
    }

    .brand-mark::before {
      top: 11px;
    }

    .brand-mark::after {
      top: 21px;
      left: 16px;
      background: var(--amber);
    }

    .brand-name {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-sub {
      margin: -2px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-label {
      padding: 0 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .nav-btn:hover {
      background: rgba(24, 35, 30, 0.05);
    }

    .nav-btn.active {
      color: var(--surface);
      background: var(--ink);
      transform: translateX(2px);
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.7;
      flex: 0 0 auto;
    }

    .nav-btn.active .nav-dot {
      background: var(--amber);
      opacity: 1;
    }

    .nav-count {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .nav-btn.active .nav-count {
      color: rgba(251, 252, 248, 0.65);
    }

    .sidebar-footer {
      margin-top: auto;
      display: grid;
      gap: 8px;
    }

    .app-version {
      padding: 0 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .readonly-banner {
      padding: 9px 16px;
      background: var(--ink);
      color: var(--surface);
      font-size: 13px;
      text-align: center;
    }

    .text-btn {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: color 0.18s ease, background 0.18s ease;
    }

    .text-btn:hover {
      color: var(--ink);
      background: rgba(24, 35, 30, 0.05);
    }

    .main {
      padding: 34px 42px 56px;
      max-width: 1180px;
      width: 100%;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mobile-quick-nav {
      display: none;
    }

    .page-kicker {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .primary-btn,
    .ghost-btn,
    .danger-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .primary-btn {
      color: var(--surface);
      background: var(--ink);
      box-shadow: 0 8px 20px rgba(24, 35, 30, 0.16);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(24, 35, 30, 0.2);
    }

    .ghost-btn {
      color: var(--ink);
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .ghost-btn:hover {
      background: rgba(24, 35, 30, 0.05);
    }

    .danger-btn {
      color: #9d2f1f;
      background: var(--accent-soft);
    }

    .hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      padding: 30px 32px;
      border: 1px solid rgba(24, 35, 30, 0.08);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 7px;
      background: var(--accent);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .date-block {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .date-block strong {
      color: var(--ink);
      font-weight: 600;
    }

    .hero h2 {
      margin: 0 0 10px;
      max-width: 640px;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .hero p {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid-two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-three {
      grid-template-columns: 1.45fr 1fr;
    }

    .card {
      min-width: 0;
      padding: 22px;
      border: 1px solid rgba(24, 35, 30, 0.08);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .section-link {
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }

    .section-link:hover {
      color: var(--accent);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 150px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: rgba(251, 252, 248, 0.45);
    }

    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-weight: 600;
    }

    .empty button {
      margin-top: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search {
      flex: 1;
      min-width: 160px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      outline: none;
      color: var(--ink);
    }

    .search:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(24, 35, 30, 0.08);
    }

    .search.date-filter {
      flex: 0 0 auto;
      width: 150px;
    }

    .sort-select {
      flex: 0 0 auto;
      width: 128px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .chip.active {
      color: var(--surface);
      background: var(--ink);
      border-color: var(--ink);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .load-more {
      margin-top: 12px;
      width: 100%;
    }

    .item {
      position: relative;
      display: grid;
      gap: 10px;
      padding: 17px 18px 17px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .item:hover {
      border-color: rgba(24, 35, 30, 0.24);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(24, 35, 30, 0.06);
    }

    .item.is-done {
      opacity: 0.62;
    }

    .item.is-done .item-title {
      text-decoration: line-through;
    }

    .item-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .check {
      width: 21px;
      height: 21px;
      margin-top: 2px;
      flex: 0 0 auto;
      border: 1.5px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      cursor: pointer;
      position: relative;
    }

    .check.checked {
      border-color: var(--green);
      background: var(--green);
    }

    .check.checked::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid var(--surface);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .item-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .item-note {
      margin: 3px 0 0;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-left: 33px;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--paper-deep);
      color: var(--muted);
      font-size: 11px;
    }

    .tag.priority-high {
      color: #a4341e;
      background: var(--accent-soft);
    }

    .tag.priority-mid {
      color: #8a5a08;
      background: #f9ecc8;
    }

    .tag.priority-low {
      color: var(--muted);
      background: var(--paper-deep);
    }

    .item-actions {
      display: flex;
      gap: 4px;
      margin-left: auto;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .item:hover .item-actions,
    .item:focus-within .item-actions {
      opacity: 1;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(24, 35, 30, 0.06);
      color: var(--ink);
    }

    .icon-btn.focus-btn.active {
      color: var(--amber);
    }

    .progress-wrap {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--paper-deep);
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), #6aa07f);
      transition: width 0.35s ease;
    }

    .goal-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .goal-plan-list {
      display: grid;
      gap: 7px;
      margin-top: 12px;
    }

    .goal-plan-link {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .goal-plan-link:hover {
      border-color: rgba(24, 35, 30, 0.24);
      background: rgba(24, 35, 30, 0.04);
    }

    .goal-plan-link.done {
      color: var(--muted);
      text-decoration: line-through;
    }

    .goal-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
    }

    .goal-filter-bar button {
      border: 0;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .goal-plan-picker {
      display: grid;
      gap: 7px;
      max-height: 240px;
      overflow: auto;
      padding-right: 4px;
    }

    .goal-plan-picker label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-weight: 400;
    }

    .goal-plan-picker input {
      width: auto;
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .goal-plan-picker label.disabled {
      color: var(--muted);
      background: var(--paper-deep);
    }

    .goal-plan-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .goal-plan-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .goal-plan-chip:hover {
      border-color: rgba(24, 35, 30, 0.28);
    }

    .goal-plan-chip.selected {
      color: var(--surface);
      background: var(--ink);
      border-color: var(--ink);
    }

    .goal-plan-chip.disabled {
      color: var(--muted);
      background: var(--paper-deep);
      cursor: not-allowed;
    }

    .new-goal-plan-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .new-goal-plan-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .new-goal-plan-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper-deep);
      font-size: 13px;
    }

    .log-body {
      color: #2c3933;
      white-space: pre-wrap;
    }

    .log-body-preview {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .log-detail-hint {
      display: inline-block;
      margin-top: 6px;
      color: var(--green);
      font-size: 12px;
    }

    .log-card {
      cursor: pointer;
    }

    .log-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .log-image-button {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      border: 0;
      border-radius: 10px;
      overflow: hidden;
      background: none;
      cursor: zoom-in;
    }

    .log-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 13, 10, 0.9);
    }

    .lightbox-backdrop.hidden {
      display: none !important;
    }

    .lightbox-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-viewport img {
      display: block;
      max-width: calc(100% - 28px);
      max-height: calc(100% - 28px);
      border-radius: 12px;
      object-fit: contain;
      background: var(--surface);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transform: translate(0, 0) scale(1);
      transform-origin: center center;
      transition: transform 0.16s ease;
    }

    .lightbox-viewport img.is-zooming {
      transition: none;
    }

    .lightbox-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(18, 25, 21, 0.74);
      backdrop-filter: blur(10px);
    }

    .lightbox-hint {
      margin: 0 6px;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
    }

    .lightbox-counter {
      min-width: 38px;
      color: #fff;
      font-size: 12px;
      text-align: center;
    }

    .lightbox-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      cursor: pointer;
      font-size: 17px;
    }

    .lightbox-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .lightbox-btn:active {
      transform: scale(0.94);
    }

    .log-image-picker {
      display: grid;
      gap: 10px;
    }

    .log-image-picker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .log-image-picker-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .log-image-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
    }

    .log-image-picker-item {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 10px;
      background: var(--paper-deep);
    }

    .log-image-picker-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .log-image-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(18, 25, 21, 0.76);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(8, 13, 10, 0.58);
    }

    .modal-backdrop.hidden {
      display: none !important;
    }

    .modal-panel {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(8, 13, 10, 0.28);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
    }

    .modal-head .item-meta {
      margin-left: 0;
    }

    .detail-body {
      margin: 0;
      color: #2c3933;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detail-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .detail-image-button {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      border: 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--paper-deep);
      cursor: zoom-in;
    }

    .detail-image-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .account-list {
      display: grid;
      gap: 10px;
    }

    .account-row {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper-deep);
    }

    .account-row-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .account-token {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .account-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .account-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .archive-date-row {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .archive-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .mood {
      font-size: 13px;
    }

    .schedule-viewbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .week-pager {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-label {
      min-width: 150px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .view-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }

    .view-switch button {
      border: 0;
      border-radius: 8px;
      padding: 7px 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }

    .view-switch button.active {
      color: var(--surface);
      background: var(--ink);
    }

    .schedule-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .schedule-board {
      --hour-height: 48px;
      min-width: 980px;
      display: grid;
      grid-template-columns: 62px repeat(7, minmax(118px, 1fr));
    }

    .schedule-corner {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--paper-deep);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .week-day-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px 6px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(251, 252, 248, 0.96);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .week-day-head.is-today {
      color: var(--accent);
    }

    .schedule-time-col {
      position: sticky;
      left: 0;
      z-index: 3;
      height: calc(var(--hour-height) * 18);
      border-right: 1px solid var(--line);
      background: rgba(249, 250, 246, 0.9);
    }

    .schedule-hour {
      position: absolute;
      right: 9px;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .week-day-column {
      position: relative;
      height: calc(var(--hour-height) * 18);
      border-right: 1px solid var(--line);
      background-image:
        linear-gradient(to bottom, rgba(24, 35, 30, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(24, 35, 30, 0.045) 1px, transparent 1px);
      background-size: 100% var(--hour-height), 100% calc(var(--hour-height) / 2);
    }

    .week-day-column:last-child {
      border-right: 0;
    }

    .week-day-column.is-today {
      background-color: rgba(239, 178, 58, 0.055);
    }

    .schedule-event {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 2px;
      padding: 2px 5px;
      overflow: hidden;
      border: 0;
      border-left: 3px solid var(--green);
      border-radius: 9px;
      background: rgba(253, 253, 249, 0.92);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(24, 35, 30, 0.06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .schedule-event:hover {
      filter: brightness(0.97);
      z-index: 4;
    }

    .schedule-event strong {
      display: block;
      overflow: hidden;
      font-size: 9px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .schedule-event span {
      overflow: hidden;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .schedule-tooltip {
      position: fixed;
      z-index: 40;
      width: max-content;
      max-width: min(280px, calc(100vw - 32px));
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--surface);
      box-shadow: 0 16px 44px rgba(24, 35, 30, 0.25);
      pointer-events: none;
    }

    .schedule-tooltip strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      line-height: 1.35;
    }

    .schedule-tooltip .tooltip-time {
      margin-bottom: 4px;
      color: rgba(251, 252, 248, 0.68);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .schedule-tooltip .tooltip-note {
      margin-top: 4px;
      color: rgba(251, 252, 248, 0.82);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .day-timeline {
      display: grid;
      gap: 10px;
    }

    .timeline-slot {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      min-height: 42px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
    }

    .timeline-slot:last-child {
      border-bottom: 0;
    }

    .timeline-time {
      padding-top: 9px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .timeline-empty {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 42px;
    }

    .timeline-empty button {
      border: 0;
      border-radius: 8px;
      padding: 6px 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .timeline-empty button:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .schedule-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--green);
      border-radius: 12px;
      background: var(--surface);
    }

    .schedule-time {
      min-width: 74px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .schedule-content {
      min-width: 0;
      flex: 1;
    }

    .schedule-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .schedule-note {
      margin: 3px 0 0;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .schedule-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .plan-progress {
      margin-left: 33px;
      color: var(--muted);
      font-size: 11px;
    }

    .step-list {
      display: grid;
      gap: 7px;
      margin: 11px 0 0 33px;
    }

    .step-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .step-check {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      flex: 0 0 auto;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      position: relative;
    }

    .step-check.checked {
      border-color: var(--green);
      background: var(--green);
    }

    .step-check.checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1px;
      width: 4px;
      height: 9px;
      border: solid var(--surface);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .step-title {
      flex: 1;
      line-height: 1.45;
    }

    .step-title.done {
      color: var(--muted);
      text-decoration: line-through;
    }

    .step-editor {
      display: grid;
      gap: 8px;
    }

    .step-editor-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .step-editor-row input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    .step-editor-row input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(24, 35, 30, 0.08);
    }

    .remove-step {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .remove-step:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(24, 35, 30, 0.42);
      backdrop-filter: none;
    }

    .dialog {
      width: min(520px, 100%);
      max-height: min(760px, calc(100vh - 44px));
      overflow: auto;
      padding: 24px;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 30px 80px rgba(24, 35, 30, 0.25);
    }

    .dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .dialog-head-actions {
      display: flex;
      gap: 4px;
    }

    .dialog h3 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: 24px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      outline: none;
      color: var(--ink);
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(24, 35, 30, 0.08);
    }

    .field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .checkbox-row input {
      margin-top: 3px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--surface);
      background: var(--ink);
      box-shadow: 0 16px 40px rgba(24, 35, 30, 0.22);
      transform: translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }

    body.readonly-mode [data-open],
    body.readonly-mode [data-edit],
    body.readonly-mode [data-delete],
    body.readonly-mode [data-toggle],
    body.readonly-mode [data-toggle-focus],
    body.readonly-mode [data-toggle-step],
    body.readonly-mode .check,
    body.readonly-mode .step-check,
    body.readonly-mode .focus-btn {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body.auth-mode .app {
      display: block;
      min-height: 100dvh;
      background: var(--paper);
    }

    body.auth-mode .sidebar {
      display: none !important;
    }

    body.auth-mode .main {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 18px 56px;
    }

    .auth-shell {
      display: grid;
      gap: 18px;
      padding: 26px 0;
    }

    .auth-brand {
      display: grid;
      gap: 8px;
      text-align: center;
    }

    .auth-brand h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: 34px;
      letter-spacing: 0.02em;
    }

    .auth-brand p {
      margin: 0;
      color: var(--muted);
    }

    .auth-card {
      padding: 22px;
      border: 1px solid rgba(24, 35, 30, 0.08);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
      padding: 4px;
      border-radius: 14px;
      background: var(--paper-deep);
    }

    .auth-tab {
      border: 0;
      border-radius: 11px;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 600;
    }

    .auth-tab.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-soft);
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .auth-form .field input {
      width: 100%;
    }

    .auth-error {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: #9d2f1f;
      font-size: 13px;
    }

    .auth-error.show {
      display: block;
    }

    @media (max-width: 860px) {
      .app {
        display: block;
        min-height: 100dvh;
      }

      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: auto;
        left: 0;
        z-index: 50;
        height: auto;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: calc(7px + var(--safe-top)) 8px 8px;
        overflow-x: auto;
        border: 0;
        border-bottom: 1px solid rgba(23, 33, 28, 0.08);
        border-radius: 0;
        background: rgba(253, 253, 249, 0.96);
        box-shadow: 0 8px 24px rgba(23, 33, 28, 0.06);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .brand,
      .brand-sub,
      .nav-label,
      .nav-count,
      .app-version,
      .sidebar-footer {
        display: none;
      }

      .nav {
        flex-direction: row;
        justify-content: space-around;
        width: 100%;
        gap: 2px;
      }

      .nav-btn {
        flex: 1 1 0;
        min-width: 46px;
        min-height: 46px;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        width: auto;
        padding: 8px 4px;
        border-radius: 15px;
        color: var(--muted);
        text-align: center;
      }

      .nav-btn:hover {
        background: transparent;
      }

      .nav-btn.active {
        color: var(--ink);
        background: rgba(229, 172, 60, 0.18);
        transform: none;
      }

      .nav-dot {
        display: none;
      }

      .nav-btn > span:not(.nav-dot) {
        font-size: 11px;
        line-height: 1.1;
        white-space: nowrap;
      }

      .main {
        padding: calc(76px + var(--safe-top)) 14px calc(28px + var(--safe-bottom));
        max-width: 640px;
        margin: 0 auto;
      }

      .mobile-quick-nav {
        display: none;
      }

      .hero-inner {
        flex-direction: column;
        gap: 16px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .topbar .primary-btn,
      .topbar .ghost-btn,
      .topbar .danger-btn {
        width: 100%;
      }

      .topbar-actions {
        width: 100%;
      }

      .lightbox-toolbar {
        top: 8px;
        right: 8px;
        left: 8px;
        justify-content: center;
        flex-wrap: wrap;
        border-radius: 18px;
      }

      .lightbox-hint {
        display: none;
      }

      .modal-panel {
        padding: 18px;
      }

      .page-title {
        font-size: clamp(26px, 8vw, 34px);
      }

      .hero {
        padding: 20px;
        border-radius: 20px;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
        box-shadow: var(--shadow-soft);
      }

      .card-header {
        margin-bottom: 14px;
      }

      .grid-two,
      .grid-three {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .search {
        flex-basis: 100%;
      }

      .search.date-filter {
        width: 100%;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .item {
        padding: 15px 14px 15px 16px;
        border-radius: 16px;
      }

      .item-actions {
        opacity: 1;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

      .dialog-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .dialog {
        width: 100%;
        max-width: none;
        max-height: 92dvh;
        padding: 20px 18px calc(20px + var(--safe-bottom));
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -18px 50px rgba(23, 33, 28, 0.22);
      }

      .dialog-actions {
        margin-top: 12px;
        position: sticky;
        bottom: 0;
        padding-top: 10px;
        background: linear-gradient(to top, var(--surface) 75%, rgba(253, 253, 249, 0));
      }

      .toast {
        right: 14px;
        bottom: calc(92px + var(--safe-bottom));
        left: 14px;
        width: auto;
        text-align: center;
      }

      .schedule-viewbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .week-pager {
        width: 100%;
        justify-content: space-between;
      }

      .view-switch {
        width: 100%;
      }

      .view-switch button {
        flex: 1;
      }

      .schedule-scroll {
        border-radius: 14px;
        -webkit-overflow-scrolling: touch;
      }

      .schedule-board {
        min-width: 760px;
      }

      .timeline-slot {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 10px;
      }

      .timeline-time {
        font-size: 11px;
      }

      .schedule-item {
        padding: 10px 11px;
        border-radius: 14px;
      }

      .schedule-title {
        font-size: 13px;
      }

      .schedule-time {
        min-width: 66px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

      if (lightboxBackdrop.classList.contains("hidden")) return;
      event.preventDefault();
      zoomLightboxBy(event.deltaY < 0 ? 1.15 : 1 / 1.15);

    archiveExportHtml.addEventListener("click", () => exportLogArchive("html"));
    archiveExportJson.addEventListener("click", () => exportLogArchive("json"));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (!lightboxBackdrop.classList.contains("hidden")) {
          closeLightbox();
          return;
        }
        if (!logDetailBackdrop.classList.contains("hidden")) {
          closeLogDetail();
          return;

          return;

          goBackDialog();

      }

    dialogForm.addEventListener("submit", handleSubmit);

    document.getElementById("exportBtn").addEventListener("click", exportData);
    document.getElementById("importBtn").addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", importData);
    document.getElementById("importCourseBtn").addEventListener("click", importCourseSchedule);
    document.getElementById("generateHomeworkBtn").addEventListener("click", generateHomeworkPlans);
    document.getElementById("generateCet6Btn").addEventListener("click", generateCet6Plan);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("sampleBtn").addEventListener("click", loadSampleData);

    initAuth();

    function generateToken() {
      return String(Math.floor(10000000 + Math.random() * 90000000));
    }

    function normalizeAccountIndex(data) {
      const source = data && typeof data === "object" ? data : {};
      return {
        version: 1,
        masterAccountId: MASTER_ACCOUNT_ID,
        masterStateId: source.masterStateId || DEFAULT_MASTER_STATE_ID,
        masterToken: String(source.masterToken || DEFAULT_MASTER_TOKEN),
        accounts: Array.isArray(source.accounts) ? source.accounts.map((account) => ({
          id: account.id,
          name: account.name || "子账户",
          type: account.type === "shared" ? "shared" : "independent",
          stateId: account.stateId || account.id,
          token: String(account.token || ""),
          readOnly: account.type === "shared" ? account.readOnly !== false : false,
          disabled: Boolean(account.disabled),
          ownerId: account.ownerId || MASTER_ACCOUNT_ID,
          createdAt: account.createdAt || new Date().toISOString(),
          updatedAt: account.updatedAt || new Date().toISOString()
        })).filter((account) => account.id && account.token) : []
      };
    }

    async function saveAccountIndex(index = accountIndex) {
      if (!index) return;
      accountIndex = normalizeAccountIndex(index);
      const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates"
        },
        body: JSON.stringify({
          id: ACCOUNT_INDEX_STATE_ID,
          data: accountIndex,
          updated_at: new Date().toISOString()
        })
      });
      if (!response.ok) throw new Error("账户数据保存失败");
    }

    async function loadAccountIndex() {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state?id=eq.${ACCOUNT_INDEX_STATE_ID}&select=data`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Accept: "application/json"
        }
      });
      if (!response.ok) throw new Error("账户数据加载失败");
      const rows = await response.json();
      if (Array.isArray(rows) && rows.length && rows[0].data) {
        accountIndex = normalizeAccountIndex(rows[0].data);
        return accountIndex;
      }
      accountIndex = normalizeAccountIndex({});
      await saveAccountIndex(accountIndex);
      return accountIndex;
    }

    function accountFromToken(token) {
      if (!accountIndex) return null;
      const normalized = String(token || "").trim();
      if (!normalized) return null;
      if (normalized === String(accountIndex.masterToken)) {
        return {
          id: MASTER_ACCOUNT_ID,
          name: "我的主账号",
          type: "master",
          stateId: accountIndex.masterStateId,
          canEdit: true,
          readOnly: false,
          isMaster: true
        };
      }
      const account = accountIndex.accounts.find((item) => item.token === normalized && !item.disabled);
      if (!account) return null;
      return {
        ...account,
        canEdit: !(account.type === "shared" && account.readOnly),
        readOnly: account.type === "shared" && account.readOnly,
        isMaster: false
      };
    }

    function saveTokenSession(token) {
      localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ token }));
    }

    function clearAuthSession() {
      currentAccount = null;
      authToken = null;
      authUser = null;
      localStorage.removeItem(AUTH_STORAGE_KEY);
      SUPABASE_STATE_ID = "main";
    }

    function renderAuth() {
      document.body.classList.add("auth-mode");
      document.body.classList.remove("readonly-mode");
      document.querySelector(".readonly-banner")?.remove();
      renderRoot.innerHTML = `
        <div class="auth-shell">
          <div class="auth-brand">
            <h1>日行一页</h1>
            <p>输入账户令牌，回到你自己的页面</p>
          </div>
          <section class="auth-card">
            <form class="auth-form" id="authForm">
              <div class="field">
                <label for="authToken">账户令牌</label>
                <input id="authToken" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入 8 位令牌" maxlength="12" required>
              </div>
              <div class="auth-error" id="authError"></div>
              <button class="primary-btn" type="submit">进入账户</button>
            </form>
          </section>
        </div>
      `;
      document.getElementById("authForm").addEventListener("submit", handleAuthSubmit);
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      const token = document.getElementById("authToken").value.trim();
      const errorBox = document.getElementById("authError");
      errorBox.classList.remove("show");
      errorBox.textContent = "";
      try {
        await loadAccountIndex();
        const account = accountFromToken(token);
        if (!account) throw new Error("令牌不正确，或者这个账户已经被停用");
        currentAccount = account;
        SUPABASE_STATE_ID = account.stateId;
        saveTokenSession(token);
        document.body.classList.remove("auth-mode");
        await initApp();
      } catch (error) {
        errorBox.textContent = error.message || "登录失败，请稍后再试";
        errorBox.classList.add("show");
      }
    }

    async function initAuth() {
      try {
        const raw = localStorage.getItem(AUTH_STORAGE_KEY);
        const saved = raw ? JSON.parse(raw) : null;
        await loadAccountIndex();
        const account = accountFromToken(saved?.token);
        if (account) {
          currentAccount = account;
          SUPABASE_STATE_ID = account.stateId;
          document.body.classList.remove("auth-mode");
          await initApp();
          return;
        }
      } catch (error) {
        // 网络不可用时仍展示登录页，登录时会再次尝试。
      }
      clearAuthSession();
      renderAuth();
    }

    function logout() {
      clearAuthSession();
      state = { goals: [], plans: [], logs: [], schedules: [], checklists: [], links: [], meta: {} };
      document.body.classList.add("auth-mode");
      document.body.classList.remove("readonly-mode");
      document.querySelector(".readonly-banner")?.remove();
      renderAuth();
    }

    async function migrateLegacyMainToUser() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state?id=eq.main&select=data`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${authToken || SUPABASE_ANON_KEY}`,
            Accept: "application/json"
          }
        });
        if (!response.ok) return null;
        const rows = await response.json();
        if (!Array.isArray(rows) || !rows.length || !rows[0].data) return null;
        await fetch(`${SUPABASE_URL}/rest/v1/family_state`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${authToken || SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            Prefer: "resolution=merge-duplicates"
          },
          body: JSON.stringify({ id: SUPABASE_STATE_ID, data: rows[0].data, updated_at: new Date().toISOString() })
        });
        return rows[0].data;
      } catch (error) {
        return null;
      }
    }

    function normalizeStateData(parsed) {
      return {
        goals: Array.isArray(parsed.goals) ? parsed.goals : [],
        plans: Array.isArray(parsed.plans)
          ? parsed.plans.map((plan) => ({
              ...plan,
              steps: Array.isArray(plan.steps) ? plan.steps : [],
              focusDate: plan.focusDate || null,
              dueDate: plan.dueDate || null
            }))
          : [],
        logs: Array.isArray(parsed.logs) ? parsed.logs.map(normalizeLog) : [],
        schedules: Array.isArray(parsed.schedules) ? parsed.schedules : [],
        checklists: Array.isArray(parsed.checklists) ? parsed.checklists : [],
        links: Array.isArray(parsed.links) ? parsed.links : [],
        meta: parsed.meta && typeof parsed.meta === "object" ? parsed.meta : {}
      };
    }

    function getLogImages(log) {
      if (!log) return [];
      if (Array.isArray(log.images)) return log.images.filter(Boolean);
      return log.imageUrl ? [log.imageUrl] : [];
    }

    function normalizeLog(log) {
      const images = getLogImages(log);
      return {
        ...log,
        images,
        imageUrl: images[0] || ""
      };
    }

    async function loadCloudState() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state?id=eq.${SUPABASE_STATE_ID}&select=data,updated_at`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            Accept: "application/json"
          }
        });
        if (!response.ok) return loadState();
        const rows = await response.json();
        if (!Array.isArray(rows) || !rows.length) {
          if (currentAccount?.isMaster) {
            const migrated = await migrateLegacyMainToUser();
            return migrated ? normalizeStateData(migrated) : loadState();
          }
          return loadState();
        }
        lastCloudUpdatedAt = rows[0].updated_at || null;
        const parsed = rows[0].data || {};
        return normalizeStateData(parsed);
      } catch (error) {
        return loadState();
      }
    }

    async function persistStateToCloud() {
      if (currentAccount?.readOnly) return;
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            Prefer: "resolution=merge-duplicates,return=representation"
          },
          body: JSON.stringify({
            id: SUPABASE_STATE_ID,
            data: state,
            updated_at: new Date().toISOString()
          })
        });
        const rows = await response.json().catch(() => null);
        if (Array.isArray(rows) && rows[0]?.updated_at) {
          lastCloudUpdatedAt = rows[0].updated_at;
        } else {
          lastCloudUpdatedAt = new Date().toISOString();
        }
        lastLocalCloudWriteAt = Date.now();
      } catch (error) {
        // 本地仍可用，云端失败不阻断使用。
      }
    }

    async function syncFromCloud() {
      if (!currentAccount || document.body.classList.contains("auth-mode")) return;
      if (cloudSyncInFlight || document.hidden) return;
      if (Date.now() - lastLocalCloudWriteAt < 5000) return;
      const overlayOpen = !dialogBackdrop.classList.contains("hidden")
        || !lightboxBackdrop.classList.contains("hidden")
        || !logDetailBackdrop.classList.contains("hidden")
        || !archiveBackdrop.classList.contains("hidden");
      const activeTag = document.activeElement?.tagName;
      if (overlayOpen || activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT") return;

      cloudSyncInFlight = true;
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state?id=eq.${SUPABASE_STATE_ID}&select=data,updated_at`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            Accept: "application/json"
          }
        });
        if (!response.ok) return;
        const rows = await response.json();
        if (!Array.isArray(rows) || !rows.length) return;
        const updatedAt = rows[0].updated_at || null;
        if (!updatedAt || updatedAt === lastCloudUpdatedAt) return;
        lastCloudUpdatedAt = updatedAt;
        state = normalizeStateData(rows[0].data || {});
        render();
      } catch (error) {
        // 云端暂不可用时保留当前页面，下一轮继续尝试。
      } finally {
        cloudSyncInFlight = false;
      }
    }

    async function initApp() {
      STORAGE_KEY = `daypage_state_v1_${SUPABASE_STATE_ID}`;
      state = await loadCloudState();
      applyAccountMode();
      if (currentAccount?.isMaster) {
        autoImportCourseScheduleOnce();
        autoGenerateHomeworkPlansOnce();
        autoGenerateCet6PlanOnce();
      }
      if (currentAccount?.canEdit) persistStateToCloud();
      render();
      if (!cloudSyncTimer) {
        cloudSyncTimer = setInterval(syncFromCloud, 10000);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) syncFromCloud();
        });
      }
    }

    function applyAccountMode() {
      const readOnly = Boolean(currentAccount?.readOnly);
      document.body.classList.toggle("readonly-mode", readOnly);
      document.querySelector(".readonly-banner")?.remove();
      if (readOnly) {
        const banner = document.createElement("div");
        banner.className = "readonly-banner";
        banner.textContent = `只读账户 · ${currentAccount?.name || "共享查看"}`;
        document.body.prepend(banner);
      }
    }

    function loadState() {
      const fallback = { goals: [], plans: [], logs: [], schedules: [], checklists: [], links: [], meta: {} };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          goals: Array.isArray(parsed.goals) ? parsed.goals : [],
          plans: Array.isArray(parsed.plans)
              ? parsed.plans.map((plan) => ({
                  ...plan,
                  steps: Array.isArray(plan.steps) ? plan.steps : [],
                  focusDate: plan.focusDate || null,
                  dueDate: plan.dueDate || null
                }))
            : [],
          logs: Array.isArray(parsed.logs) ? parsed.logs.map(normalizeLog) : [],
          schedules: Array.isArray(parsed.schedules) ? parsed.schedules : [],
          checklists: Array.isArray(parsed.checklists) ? parsed.checklists : [],
          links: Array.isArray(parsed.links) ? parsed.links : [],
          meta: parsed.meta && typeof parsed.meta === "object" ? parsed.meta : {}
        };
      } catch (error) {
        return fallback;
      }
    }

    function saveState() {
      if (currentAccount?.readOnly) {
        showToast("当前是只读账户，不能修改内容");
        return;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      persistStateToCloud();
      render();

    function uid(prefix) {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDate(key) {
      if (!key) return "未设定";
      const date = new Date(`${key}T00:00:00`);
      if (Number.isNaN(date.getTime())) return key;
      return new Intl.DateTimeFormat("zh-CN", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(date);
    }

    function fullDateLabel() {
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(new Date());
    }

    function priorityLabel(value) {
      return { high: "高优先级", mid: "中优先级", low: "低优先级" }[value] || "普通";
    }

    function moodLabel(value) {
      return { great: "很好", good: "不错", calm: "平静", low: "低落", tired: "疲惫" }[value] || "记录";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function activePlans() {
      return state.plans.filter((plan) => !plan.completed);
    }

    function dueTodayPlans() {
      return state.plans
        .filter((plan) => {
          const due = effectiveDueDate(plan);
          return !plan.completed && (plan.date === todayKey || (due && due <= todayKey));
        })
        .sort(sortPlans);
    }

    function todayFocusPlans() {
      return state.plans
        .filter((plan) => plan.focusDate === todayKey)
        .sort((a, b) => Number(a.completed) - Number(b.completed) || sortPlans(a, b));
    }

    function sortPlans(a, b) {
      const weight = { high: 0, mid: 1, low: 2, normal: 3 };
      if (a.date !== b.date) {
        if (!a.date) return 1;
        if (!b.date) return -1;
        return a.date.localeCompare(b.date);
      }
      return (weight[a.priority] ?? 3) - (weight[b.priority] ?? 3);
    }

    function sortPlansByPriority(a, b) {
      const weight = { high: 0, mid: 1, low: 2, normal: 3 };
      if (Number(a.completed) !== Number(b.completed)) return Number(a.completed) - Number(b.completed);
      const diff = (weight[a.priority] ?? 3) - (weight[b.priority] ?? 3);
      if (diff !== 0) return diff;
      if (a.date !== b.date) return (a.date || "9999-99-99").localeCompare(b.date || "9999-99-99");
      return (a.title || "").localeCompare(b.title || "");
    }

    function goalById(id) {
      return state.goals.find((goal) => goal.id === id);
    }

    function effectiveDueDate(plan) {
      return plan.dueDate || plan.date || null;
    }

    function categoryLabel(value) {
      return { study: "学习", work: "工作", health: "健康", rest: "休息", life: "生活", other: "其他" }[value] || "其他";
    }

    function categoryColor(value) {
      return { study: "#3f7a5b", work: "#d9532f", health: "#4f7cac", rest: "#b78b26", life: "#8a6f9e", other: "#7b847f" }[value] || "#7b847f";
    }

    function todaySchedules() {
      return state.schedules
        .filter((item) => item.date === todayKey)
        .sort((a, b) => (a.startTime || "99:99").localeCompare(b.startTime || "99:99"));
    }

    function sortSchedules(list) {
      return [...list].sort((a, b) => {
        if (a.date !== b.date) return (a.date || "").localeCompare(b.date || "");
        return (a.startTime || "99:99").localeCompare(b.startTime || "99:99");
      });
    }

    function slotTimes() {
      const slots = [];
      for (let hour = 6; hour < 24; hour += 1) {
        slots.push(`${String(hour).padStart(2, "0")}:00`);
        slots.push(`${String(hour).padStart(2, "0")}:30`);
      }
      return slots;
    }

    function slotIndex(time) {
      if (!time) return -1;
      const [hour, minute] = time.split(":").map(Number);
      if (hour >= 24) return slotTimes().length;
      const base = (hour - 6) * 2 + (minute >= 30 ? 1 : 0);
      return Math.max(0, Math.min(slotTimes().length - 1, base));
    }

    function scheduleSpan(item) {
      const start = slotIndex(item.startTime);
      const end = slotIndex(item.endTime || item.startTime);
      if (start < 0) return 1;
      if (end <= start) return 1;
      return end - start;
    }

    function weekDates(offset = 0) {
      const now = new Date();
      const day = now.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset + offset * 7);
      return Array.from({ length: 7 }, (_, index) => {
        const date = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + index);
        return localDateKey(date);
      });
    }

    function weekRangeLabel(offset) {
      const dates = weekDates(offset);
      const start = new Date(`${dates[0]}T00:00:00`);
      const end = new Date(`${dates[6]}T00:00:00`);
      const formatter = new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric" });
      return `${formatter.format(start)} — ${formatter.format(end)}`;
    }

    function dayLabel(key) {
      if (key === todayKey) return "今天";
      const date = new Date(`${key}T00:00:00`);
      return new Intl.DateTimeFormat("zh-CN", { weekday: "short" }).format(date);
    }

    function goalStats(goalId) {
      const plans = state.plans.filter((plan) => plan.goalId === goalId);
      let total = 0;
      let done = 0;
      plans.forEach((plan) => {
        const steps = Array.isArray(plan.steps) ? plan.steps : [];
        if (steps.length) {
          total += steps.length;
          done += steps.filter((step) => step.done).length;
        } else {
          total += 1;
          if (plan.completed) done += 1;
        }
      });
      return {
        plans,
        total,
        done,
        percent: total ? Math.round((done / total) * 100) : 0
      };
    }

    function goalCard(goal) {
      const stats = goalStats(goal.id);
      return `

    }

          const due = effectiveDueDate(plan);
          return (plan.date >= monday && plan.date <= sunday) || (due && due >= monday && due <= sunday);

      }
      if (plansFilter === "date") list = list.filter((plan) => plan.date === plansDate || effectiveDueDate(plan) === plansDate);
      if (plansFilter === "upcoming") list = list.filter((plan) => !plan.completed && effectiveDueDate(plan) && effectiveDueDate(plan) > todayKey);
      if (plansFilter === "overdue") list = list.filter((plan) => !plan.completed && effectiveDueDate(plan) && effectiveDueDate(plan) < todayKey);

    function timeToMinutes(time) {
      if (!time) return null;
      const [hour, minute] = time.split(":").map(Number);
      if (Number.isNaN(hour) || Number.isNaN(minute)) return null;
      return hour * 60 + minute;
    }

    function layoutDayEvents(items) {
      const dayStart = 6 * 60;
      const dayEnd = 24 * 60;
      const totalMinutes = dayEnd - dayStart;

      const events = items
        .map((item) => {
          let start = timeToMinutes(item.startTime);
          let end = timeToMinutes(item.endTime || item.startTime);
          if (start === null) start = dayStart;
          if (end === null) end = Math.min(dayEnd, start + 30);
          start = Math.max(dayStart, Math.min(dayEnd, start));
          end = Math.max(dayStart, Math.min(dayEnd, end));
          if (end <= start) end = Math.min(dayEnd, start + 30);
          const visualEnd = Math.min(dayEnd, Math.max(end, start + 30));
          return {
            item,
            start,
            end,
            visualEnd,
            top: ((start - dayStart) / totalMinutes) * 100,
            height: ((visualEnd - start) / totalMinutes) * 100
          };
        })
        .sort((a, b) => a.start - b.start || a.end - b.end);

      const clusters = [];
      let cluster = [];
      let clusterEnd = -1;

      events.forEach((event) => {
        if (cluster.length && event.start < clusterEnd) {
          cluster.push(event);
          clusterEnd = Math.max(clusterEnd, event.visualEnd);
        } else {
          if (cluster.length) clusters.push(cluster);
          cluster = [event];
          clusterEnd = event.visualEnd;
        }
      });
      if (cluster.length) clusters.push(cluster);

      return clusters.flatMap((group) => {
        const lanes = [];
        group.forEach((event) => {
          let lane = lanes.findIndex((lastEnd) => lastEnd <= event.start);
          if (lane < 0) {
            lane = lanes.length;
            lanes.push(event.visualEnd);
          } else {
            lanes[lane] = event.visualEnd;
          }
          event.lane = lane;
        });
        const laneCount = lanes.length;
        group.forEach((event) => {
          event.left = (event.lane / laneCount) * 100;
          event.width = 100 / laneCount;
        });
        return group;
      });
    }

    function isTokenUsed(token, exceptAccountId = "") {
      if (!accountIndex) return false;
      if (token === accountIndex.masterToken && exceptAccountId !== MASTER_ACCOUNT_ID) return true;
      return accountIndex.accounts.some((account) => account.token === token && account.id !== exceptAccountId);
    }

    function nextUniqueToken() {
      let token = generateToken();
      let attempts = 0;
      while (isTokenUsed(token) && attempts < 30) {
        token = generateToken();
        attempts += 1;
      }
      return token;
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(String(value));

      }
    }

      const response = await fetch(`${SUPABASE_URL}/rest/v1/family_state`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates"
        },
        body: JSON.stringify({
          id: stateId,
          data,
          updated_at: new Date().toISOString()
        })
      });
      if (!response.ok) throw new Error("账户内容初始化失败");
    }

    async function changeOwnToken(nextToken) {
      const token = String(nextToken).replace(/\D/g, "");
      if (token.length !== 8) {
        showToast("令牌需要是 8 位数字");
        return;
      }
      if (isTokenUsed(token, currentAccount.id)) {
        showToast("这个令牌已经被其他账户使用");
        return;
      }
      try {
        if (currentAccount.isMaster) {
          accountIndex.masterToken = token;
        } else {
          const child = accountIndex.accounts.find((item) => item.id === currentAccount.id);
          if (!child) return;
          child.token = token;
          child.updatedAt = new Date().toISOString();
        }
        await saveAccountIndex(accountIndex);
        currentAccount.token = token;
        saveTokenSession(token);
        showToast("我的令牌已更新");
        renderAccount();
      } catch (error) {
        showToast(error.message || "令牌更新失败");
      }
    }

        id: uid("acct"),

        stateId: type === "shared" ? accountIndex.masterStateId : "",
        token,

        disabled: false,
        ownerId: MASTER_ACCOUNT_ID,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      if (account.type === "independent") {
        account.stateId = account.id;
        await saveFamilyState(account.stateId, { goals: [], plans: [], logs: [], schedules: [], checklists: [], links: [], meta: {} });

    function setupLogImagePicker() {

      if (!picker || !input || !grid || !hint) return;

      const renderImages = () => {
        grid.innerHTML = draftLogImages.map((src, index) => `
          <div class="log-image-picker-item">
            <img src="${escapeHtml(src)}" alt="">
            <button type="button" class="log-image-remove" data-remove-log-image="${index}" aria-label="删除这张照片">✕</button>

        const remaining = 9 - draftLogImages.length;
        const selected = files.slice(0, remaining);
        if (files.length > remaining) {
          showToast(`一条日志最多 9 张，已选择前 ${remaining} 张`);

          if (!file.type.startsWith("image/")) {
            showToast("有文件不是图片，已跳过");
            continue;

          try {
            const compressed = await compressImage(file);
            if (!draftLogImages.includes(compressed)) {
              draftLogImages.push(compressed);
              renderImages();
            }
          } catch (error) {
            showToast("有图片处理失败，已跳过");
          }
        }
      });

      renderImages();
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const maxEdge = 2560;
            let width = image.width;
            let height = image.height;
            if (width > maxEdge || height > maxEdge) {
              const scale = Math.min(maxEdge / width, maxEdge / height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.9));
          };
          image.onerror = reject;
          image.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      if (type === "plan") {
        const selectedGoalId = item.goalId || draftPlanGoalId;
        const goalOptions = [
          `<option value="">不关联目标</option>`,
          ...state.goals.map((goal) => `<option value="${goal.id}" ${selectedGoalId === goal.id ? "selected" : ""}>${escapeHtml(goal.title)}</option>`)

        return `

          <div class="field">

          <div class="form-row">

            <label for="planGoal">关联目标</label>

      if (type === "schedule") {
        const planOptions = [
          `<option value="">不关联计划</option>`,

        return `

          <div class="form-row">
            <div class="field">
              <label for="scheduleDate">日期</label>

            </div>
